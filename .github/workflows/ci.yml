name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # fail if uv.lock is out of date
  YOLO_OFFLINE: "true"    # no Ultralytics telemetry or online checks in CI

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
      - run: uv run --only-group dev ruff format --check .
      - run: uv run --only-group dev ruff check .

  types:
    name: Types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --no-group docs
      - run: uv run --no-sync mypy

  tests:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --no-group docs
      # The real-model smoke test downloads the SGBlur weights (~20 MB) once per registry change.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/sgblur-video/models
          key: models-${{ hashFiles('models/registry.yaml') }}
      - name: Unit, privacy (synthetic oracle) and integration tests
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage >= 85 % on core, privacy and semantics
        run: >-
          uv run --no-sync coverage report --fail-under=85
          --include='src/sgblur_video/core/*,src/sgblur_video/privacy/*,src/sgblur_video/semantics/*'
      - run: uv run --no-sync python scripts/gen_config_reference.py --check

  docs:
    name: Documentation (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
      # mkdocstrings reads the sources statically: no need to install the heavy runtime.
      - run: uv run --only-group docs mkdocs build --strict
