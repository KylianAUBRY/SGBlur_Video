# Install once with `uv run pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]   # media and weights must never be committed
      - id: check-yaml
        args: ["--unsafe"]      # mkdocs.yml uses Python tags
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: config-reference
        name: configuration reference is up to date
        entry: uv run python scripts/gen_config_reference.py --check
        language: system
        files: ^(src/sgblur_video/config\.py|docs/reference/configuration\.md)$
        pass_filenames: false
